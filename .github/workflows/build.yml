name: Build Dolphin-P1 Armbian

on:
  workflow_dispatch:
    inputs:
      clean_runner:
        description: 'Free GitHub runner disk space before building'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: dolphin-p1-build
  cancel-in-progress: true

jobs:
  build:
    name: Dolphin-P1 / Debian Trixie / Linux current
    runs-on: ubuntu-24.04

    steps:
      - name: Free GitHub runner disk space
        if: ${{ inputs.clean_runner }}
        uses: descriptinc/free-disk-space@1b4b157593c6801212a2ed488c205e0a810b4592

      - name: Checkout custom repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: custom

      - name: Checkout Armbian OS
        uses: actions/checkout@v4
        with:
          repository: armbian/os
          ref: main
          fetch-depth: 1
          path: os

      - name: Checkout Armbian build framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: main
          fetch-depth: 1
          path: build

      - name: Prepare custom board and userpatches
        shell: bash
        run: |
          set -euo pipefail

          mkdir -pv build/userpatches
          rsync -av os/userpatches/. build/userpatches/
          rsync -av custom/userpatches/. build/userpatches/

          # Board .csc files are discovered from build/config/boards.
          # Do this AFTER the Armbian framework checkout and BEFORE compile.sh.
          echo "Armbian build revision:"
          git -C build rev-parse --short HEAD

          test -s build/userpatches/config/boards/dolphin-p1.csc
          echo "Board configuration:"
          echo "build/userpatches/config/boards/dolphin-p1.csc"
          readlink -f build/userpatches/config/boards/dolphin-p1.csc
          grep -E '^(BOARD_NAME|BOARDFAMILY|BOOTCONFIG|BOOT_FDT_FILE)=' \
            build/userpatches/config/boards/dolphin-p1.csc

          echo "Custom DTS patch:"
          ls -l custom/userpatches/kernel/sunxi-current/0001-dolphin-p1-dts.patch

      - name: Install Armbian build requirements
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail
          sudo ./compile.sh requirements
          sudo chown -R "$USER:$USER" .

      - name: Build Dolphin-P1 image
        working-directory: build
        shell: bash
        run: |
          set -euo pipefail

          ./compile.sh build \
            REVISION="26.8.9" \
            BOARD="dolphin-p1" \
            BRANCH="current" \
            RELEASE="trixie" \
            KERNEL_CONFIGURE="no" \
            BUILD_DESKTOP="no" \
            BUILD_MINIMAL="yes" \
            INSTALL_HEADERS="no" \
            EXTRAWIFI="no" \
            KERNEL_BTF="no" \
            COMPRESS_OUTPUTIMAGE="sha,img,xz" \
            SHARE_LOG="yes" \
            EXPERT="yes"

      - name: Verify U-Boot artifact and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s build/output/images/u-boot-sunxi-with-spl.bin
          file build/output/images/u-boot-sunxi-with-spl.bin
          (
            cd build/output/images
            sha256sum * > sha256sums.txt
          )

      - name: Show build output
        if: always()
        shell: bash
        run: |
          echo "=== build/output/images ==="
          find build/output/images -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true
          echo
          echo "=== build/output ==="
          find build/output -maxdepth 2 -type f | head -100 2>/dev/null || true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-p1-armbian
          path: |
            build/output/images/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dolphin-p1-build-${{ github.run_number }}
          name: Dolphin-P1 Armbian build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Inphic H202A / Dolphin-P1, Allwinner H2+.

            - Debian Trixie
            - Linux current
            - Minimal CLI
            - Clean eMMC layout
            - Custom Dolphin-P1 DTB
            - Mainline sunxi U-Boot
            - Standalone u-boot-sunxi-with-spl.bin for FEL bring-up
            - No original Android/vendor partition layout

            This is a manually triggered development build.
          files: |
            build/output/images/*
