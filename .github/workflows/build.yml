name: Build Dolphin-P1 Armbian

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build.yml'
      - 'userpatches/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: dolphin-p1-build
  cancel-in-progress: true

jobs:
  build:
    name: Dolphin-P1 / Debian Trixie / Linux current
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Prepare Armbian board configuration
        shell: bash
        run: |
          set -euo pipefail

          # armbian/build@main copies custom/userpatches into build/userpatches,
          # but board .csc files are discovered from build/config/boards.
          # Pre-create the framework checkout and install the custom board there;
          # the official composite action then reuses this checkout (clean=false).
          if [[ ! -d build/.git ]]; then
            git clone --depth=1 --branch main https://github.com/armbian/build.git build
          fi

          install -Dm0644             config/boards/dolphin-p1.csc             build/config/boards/dolphin-p1.csc

          test -s build/config/boards/dolphin-p1.csc
          echo "Installed board configuration:"
          readlink -f build/config/boards/dolphin-p1.csc
          grep -E '^(BOARD_NAME|BOARDFAMILY|BOOTCONFIG|BOOT_FDT_FILE)='             build/config/boards/dolphin-p1.csc

      - name: Build Armbian image
        uses: armbian/build@main
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_board: dolphin-p1
          armbian_target: build
          armbian_branch: main
          armbian_kernel_branch: current
          armbian_release: trixie
          armbian_ui: minimal
          armbian_compress: sha,img,xz
          armbian_release_title: 'Dolphin-P1 Armbian image'
          armbian_release_body: |
            Inphic H202A / Dolphin-P1, Allwinner H2+.

            Clean eMMC layout:
            - raw Allwinner SPL/U-Boot area before the first partition
            - p1: 256 MiB FAT32 /boot
            - p2: remaining space ext4 /

            This image does not use the original Android/sunxi partition layout.
          armbian_runner_clean: yes
